<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>SECRETORA · 💕 Private Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --pink: #ff4d94; --gold: #ffd700; --vip: #9b59b6; --luxury: #c9a84c; --ultimate: #e0c8ff; }
    body {
      font-family: 'Inter', sans-serif;
      background: #faf5f8;
      color: #1a0e14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 0 72px 0;
      transition: background 0.4s, color 0.4s;
    }
    body.dark { background: #0d060a; color: #f5e6f0; }
    #app {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px 32px 0 0;
      box-shadow: 0 20px 60px rgba(255, 20, 100, 0.08);
      overflow: hidden;
      position: relative;
      min-height: 780px;
      border: 1px solid rgba(255, 80, 150, 0.08);
      transition: background 0.4s;
    }
    body.dark #app { background: #160d14; border-color: rgba(255, 80, 150, 0.12); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f0e8ec; }
    body.dark ::-webkit-scrollbar-track { background: #2a1a22; }
    ::-webkit-scrollbar-thumb { background: #ff4d94; border-radius: 8px; }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 8px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 80, 150, 0.06);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background 0.4s;
    }
    body.dark .app-header {
      background: rgba(22, 13, 20, 0.8);
      border-bottom-color: rgba(255, 80, 150, 0.08);
    }
    .app-header .logo {
      font-weight: 800; font-size: 1.3rem;
      background: linear-gradient(135deg, #ff4d94, #e63a7a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .token-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 77, 148, 0.08);
      border: 1px solid rgba(255, 77, 148, 0.15);
      border-radius: 40px;
      padding: 4px 14px 4px 10px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1a0e14;
      transition: all 0.3s;
      cursor: pointer;
    }
    body.dark .token-pill {
      background: rgba(255, 77, 148, 0.12);
      color: #f5e6f0;
      border-color: rgba(255, 77, 148, 0.2);
    }
    .token-pill i { color: #ffd700; font-size: 1rem; }
    .token-pill .token-amount {
      min-width: 30px;
      display: inline-block;
      text-align: center;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 18px; border-radius: 60px; font-weight: 600; font-size: 0.85rem;
      border: none; background: #f0e8ec; color: #1a0e14;
      transition: all 0.2s; cursor: pointer;
      touch-action: manipulation;
    }
    body.dark .btn { background: #2a1a22; color: #f5e6f0; }
    .btn-primary { background: linear-gradient(145deg, #ff4d94, #e63a7a); color: white; box-shadow: 0 4px 16px rgba(255, 20, 100, 0.25); }
    .btn-primary:active { transform: scale(0.96); }
    .btn-outline { background: transparent; border: 2px solid #ff4d94; color: #ff4d94; }
    .btn-outline:active { background: rgba(255, 20, 100, 0.05); }
    .btn-sm { padding: 6px 14px; font-size: 0.75rem; }
    .btn-block { width: 100%; justify-content: center; }
    .btn-gold { background: linear-gradient(145deg, #ffd700, #f0c000); color: #1a0e14; }
    .btn-vip { background: linear-gradient(145deg, #9b59b6, #8e44ad); color: white; }
    .btn-luxury { background: linear-gradient(145deg, #c9a84c, #b8962c); color: white; }
    .btn-ultimate { background: linear-gradient(145deg, #e0c8ff, #c9a8ff); color: #1a0e14; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      display: flex; justify-content: space-around;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 80, 150, 0.08);
      padding: 4px 0 12px 0;
      z-index: 999;
      max-width: 480px;
      margin: 0 auto;
      right: 0;
      transition: background 0.4s;
    }
    body.dark .bottom-nav { background: rgba(13, 6, 10, 0.92); border-top-color: rgba(255, 80, 150, 0.1); }
    .bottom-nav button {
      background: none; border: none; color: #9a8a92; font-size: 0.6rem;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: 0.2s; padding: 4px 8px; position: relative;
    }
    .bottom-nav button i { font-size: 1.2rem; }
    .bottom-nav button.active { color: #ff4d94; }
    .bottom-nav button:active { transform: scale(0.92); }

    .page { display: none; padding: 12px 16px 30px; animation: fadeSlide 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeSlide { 0% { opacity: 0.3; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }

    .modal-overlay {
      position: fixed; top:0;left:0;width:100%;height:100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000; padding: 16px;
      opacity:0; pointer-events: none; transition: 0.3s;
    }
    .modal-overlay.show { opacity:1; pointer-events: auto; }
    .modal {
      background: #ffffff;
      border-radius: 32px;
      max-width: 400px;
      width: 100%;
      padding: 24px 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.15);
      border: 1px solid rgba(255, 80, 150, 0.08);
      max-height: 90vh;
      overflow-y: auto;
    }
    body.dark .modal { background: #1a1020; border-color: rgba(255, 80, 150, 0.12); }
    .modal input, .modal select, .modal textarea {
      width: 100%; padding: 12px 16px; border-radius: 16px;
      background: #f5f0f2;
      border: 1px solid #e8e0e4;
      color: #1a0e14;
      font-size: 0.95rem;
      transition: 0.2s;
    }
    body.dark .modal input, body.dark .modal select, body.dark .modal textarea {
      background: #261a22;
      border-color: #3a2a32;
      color: #f5e6f0;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus {
      border-color: #ff4d94;
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 20, 100, 0.08);
    }

    .toast-container {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      z-index: 3000; display: flex; flex-direction: column; gap: 6px;
      width: 90%; max-width: 400px; pointer-events: none;
    }
    .toast {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 80, 150, 0.1);
      padding: 10px 18px;
      border-radius: 60px;
      color: #1a0e14;
      font-weight: 500;
      font-size: 0.85rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      display: flex; align-items: center; gap: 10px;
      pointer-events: auto;
      animation: slideIn 0.3s ease;
    }
    body.dark .toast { background: #1a1020; color: #f5e6f0; border-color: rgba(255, 80, 150, 0.12); }
    @keyframes slideIn { 0% { opacity:0; transform: translateY(-20px); } 100% { opacity:1; transform: translateY(0); } }

    .vault-card {
      background: #ffffff;
      border-radius: 20px; padding: 16px; margin-bottom: 12px;
      border-left: 4px solid #e8dce0;
      transition: all 0.25s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.02);
      display: flex; flex-direction: column; gap: 4px;
    }
    body.dark .vault-card { background: #1a1020; border-left-color: #3a2a32; }
    .vault-card.premium { border-left-color: #ffd700; background: linear-gradient(145deg, #fffdf5, #fff8ec); }
    body.dark .vault-card.premium { background: linear-gradient(145deg, #1f1a10, #14100a); }
    .vault-card.vip { border-left-color: #9b59b6; background: linear-gradient(145deg, #f8f0fc, #f0e8f5); }
    body.dark .vault-card.vip { background: linear-gradient(145deg, #1a1020, #140a1a); }
    .vault-card.luxury { border-left-color: #c9a84c; background: linear-gradient(145deg, #fdfaf0, #f5f0e0); }
    body.dark .vault-card.luxury { background: linear-gradient(145deg, #1a1a10, #14140a); }
    .vault-card.ultimate { border-left-color: #e0c8ff; background: linear-gradient(145deg, #f8f0ff, #f0e8fa); }
    body.dark .vault-card.ultimate { background: linear-gradient(145deg, #1a1020, #0a0a1a); }

    .badge {
      background: #f0e8ec; padding: 2px 10px; border-radius: 40px;
      font-size: 0.65rem; font-weight: 500;
    }
    body.dark .badge { background: #2a1a22; color: #d0b0c0; }
    .badge-gold { background: #ffd700; color: #1a0e14; }
    .badge-vip { background: #9b59b6; color: white; }
    .badge-luxury { background: #c9a84c; color: white; }
    .badge-ultimate { background: #e0c8ff; color: #1a0e14; }

    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .mt-2 { margin-top: 16px; }
    .mb-2 { margin-bottom: 16px; }
    .hidden { display: none; }
    .text-center { text-align: center; }

    /* Vault Discovery Grid */
    .vault-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .vault-discovery-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid #e8e0e4;
      transition: all 0.3s;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    body.dark .vault-discovery-card {
      background: #1a1020;
      border-color: #2a1a2a;
    }
    .vault-discovery-card .vault-icon {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 4px;
    }
    .vault-discovery-card .vault-name {
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
    }
    .vault-discovery-card .vault-desc {
      font-size: 0.7rem;
      color: #7a6a72;
      text-align: center;
      min-height: 32px;
    }
    body.dark .vault-discovery-card .vault-desc {
      color: #9a8a92;
    }
    .vault-discovery-card .vault-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6rem;
      color: #7a6a72;
      margin-top: 4px;
    }
    body.dark .vault-discovery-card .vault-meta {
      color: #9a8a92;
    }
    .vault-discovery-card .vault-status {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
    }
    .vault-discovery-card .vault-status.locked { color: #e74c3c; }
    .vault-discovery-card .vault-status.unlocked { color: #27ae60; }
    .vault-discovery-card .btn {
      width: 100%;
      margin-top: 6px;
      font-size: 0.7rem;
      padding: 8px;
    }

    /* Enhanced Shop Styles */
    .shop-section {
      margin-bottom: 20px;
    }
    .shop-section-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ff4d94;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .shop-item {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 12px;
      border: 1px solid #e8e0e4;
      transition: all 0.3s;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    body.dark .shop-item {
      background: #1a1020;
      border-color: #2a1a2a;
    }
    .shop-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(255, 20, 100, 0.08);
    }
    .shop-item .item-icon {
      font-size: 2.2rem;
      margin-bottom: 4px;
    }
    .shop-item .item-name {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.2;
    }
    .shop-item .item-price {
      font-size: 0.7rem;
      color: #ffd700;
      font-weight: 600;
      background: rgba(255, 215, 0, 0.1);
      padding: 2px 10px;
      border-radius: 12px;
    }
    .shop-item .rarity {
      font-size: 0.55rem;
      padding: 2px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 2px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .rarity-common { background: #e8e0e4; color: #6a5a62; }
    body.dark .rarity-common { background: #2a2a2a; color: #aaa; }
    .rarity-rare { background: #d4e4f4; color: #2a5a7a; }
    body.dark .rarity-rare { background: #4a6a8a; color: #8ac4ff; }
    .rarity-epic { background: #e4d4f4; color: #5a2a7a; }
    body.dark .rarity-epic { background: #6a3a8a; color: #c88aff; }
    .rarity-legendary { background: #f4e8c4; color: #7a5a1a; }
    body.dark .rarity-legendary { background: #8a6a2a; color: #ffd700; }
    .rarity-mythic { background: #f4d4e4; color: #7a2a4a; }
    body.dark .rarity-mythic { background: #8a2a4a; color: #ff6a9a; }
    .shop-item .tier-required {
      font-size: 0.55rem;
      color: #ff4d94;
      font-weight: 600;
      background: rgba(255, 77, 148, 0.08);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .shop-item .btn {
      width: 100%;
      margin-top: 6px;
      font-size: 0.7rem;
      padding: 6px;
    }
    .shop-item .owned-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #27ae60;
      color: white;
      font-size: 0.5rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
    }
    .shop-filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      padding: 4px 0;
    }
    .shop-filters .btn {
      font-size: 0.7rem;
      padding: 6px 14px;
    }
    .shop-filters .btn.active {
      background: #ff4d94;
      color: white;
    }
    body.dark .shop-filters .btn.active {
      background: #ff4d94;
      color: white;
    }

    @media (max-width: 500px) { #app { border-radius: 0; min-height: 100vh; } .bottom-nav { padding: 2px 0 10px; } }
  </style>
</head>
<body>
<div id="app">
  <!-- HEADER WITH TOKEN -->
  <div class="app-header">
    <span class="logo">SECRETORA</span>
    <div class="token-pill" onclick="toggleTokenPanel()">
      <i class="fas fa-coins"></i>
      <span class="token-amount" id="headerTokenBalance">0</span>
    </div>
  </div>

  <!-- PUBLIC PAGES -->
  <div id="page-landing" class="page active">
    <div class="text-center" style="padding:10px 16px 0;">
      <div style="font-size:3rem; margin:6px 0;" id="vaultGlow">🔐</div>
      <p style="color:#7a6a72; font-size:0.85rem;">Private things deserve a private place.</p>
      <div style="display:flex; gap:8px; justify-content:center; margin:10px 0;">
        <button class="btn btn-sm btn-primary" onclick="navigateTo('create')"><i class="fas fa-plus"></i> Create</button>
        <button class="btn btn-sm btn-outline" onclick="navigateTo('vault')"><i class="fas fa-vault"></i> My Vaults</button>
      </div>
    </div>

    <!-- EXPLORE VAULTS SECTION - Only real user vaults -->
    <div style="margin-top:12px;">
      <div class="flex-between">
        <h3 style="font-size:1.1rem; font-weight:600;">🌟 Explore Vaults</h3>
        <span style="font-size:0.7rem; color:#7a6a72;" id="vaultCountDiscovery">0 vaults</span>
      </div>
      <div id="discoveryGrid" class="vault-grid"></div>
    </div>
  </div>

  <div id="page-vault" class="page">
    <div class="flex-between mb-2"><span style="font-weight:600;">🔐 My Vaults</span> <span id="vaultCount" style="color:#7a6a72;">0</span></div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input id="searchInput" placeholder="🔍 Find..." style="flex:1; background:#f5f0f2; border:1px solid #e8e0e4; border-radius:40px; padding:10px 16px; color:#1a0e14;">
      <button class="btn btn-sm btn-outline" onclick="filterSecrets()"><i class="fas fa-search"></i></button>
    </div>
    <div id="vaultList"></div>
    <div id="emptyVault" class="hidden text-center" style="padding:40px 20px; color:#9a8a92;">
      <i class="fas fa-box-open" style="font-size:2.5rem;"></i><p>Your vault is empty.</p>
      <button class="btn btn-primary btn-sm mt-2" onclick="navigateTo('create')">+ CREATE VAULT</button>
    </div>
  </div>

  <div id="page-create" class="page">
    <h2 style="font-size:1.2rem; color:#ff4d94;">✧ New Vault</h2>
    <div style="background:transparent; padding:0;">
      <div style="margin-bottom:10px;"><input id="secName" placeholder="Vault name" style="width:100%; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14;"></div>
      <div style="margin-bottom:10px;"><input id="secDesc" placeholder="Description" style="width:100%; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14;"></div>
      <div style="margin-bottom:10px;"><textarea id="secContent" placeholder="Secret message..." style="width:100%; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14; min-height:80px;"></textarea></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input id="secPass" type="password" placeholder="Password" style="flex:1; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14; min-width:100px;">
        <input id="secPass2" type="password" placeholder="Confirm" style="flex:1; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14; min-width:100px;">
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
        <select id="secTier" style="flex:1; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14;">
          <option value="standard">Standard</option>
          <option value="premium">Premium</option>
          <option value="vip">VIP</option>
          <option value="luxury">Luxury</option>
          <option value="ultimate">Ultimate</option>
        </select>
        <select id="secTheme" style="flex:1; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14;">
          <option value="Midnight">Midnight</option>
          <option value="Luxury Pink">Luxury Pink</option>
          <option value="Rose">Rose</option>
          <option value="Love">Love</option>
          <option value="Royal">Royal</option>
        </select>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <select id="secCategory" style="flex:1; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14;">
          <option value="❤️ Love">❤️ Love</option>
          <option value="👨‍👩‍👧 Family">👨‍👩‍👧 Family</option>
          <option value="👥 Friends">👥 Friends</option>
          <option value="💼 Work">💼 Work</option>
          <option value="🔐 Personal">🔐 Personal</option>
        </select>
        <input id="secRecipient" placeholder="Recipient" style="flex:1; padding:12px 16px; border-radius:16px; background:#f5f0f2; border:1px solid #e8e0e4; color:#1a0e14;">
      </div>
      <div style="margin-top:10px;">
        <label style="font-size:0.8rem; color:#7a6a72; display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="secPublic" checked> Make this vault publicly discoverable
        </label>
      </div>
      <button class="btn btn-primary btn-block mt-2" onclick="handleCreateSecret()"><i class="fas fa-save"></i> CREATE & LOCK</button>
    </div>
  </div>

  <!-- SHOP - Enhanced Design -->
  <div id="page-shop" class="page">
    <div class="flex-between mb-2">
      <span style="font-weight:600; font-size:1.1rem;">🛍️ Secret Shop</span>
      <span class="token-pill" style="padding:2px 12px;"><i class="fas fa-coins"></i> <span id="shopTokenDisplay">0</span></span>
    </div>
    
    <div class="shop-filters">
      <button class="btn btn-sm active" data-shop-filter="all" onclick="filterShop('all')">All</button>
      <button class="btn btn-sm" data-shop-filter="box" onclick="filterShop('box')">Boxes</button>

function unlockSecret(id, password) {
  const sec = APP.secrets.find(s => s.id === id);
  if (!sec) { toast('Secret not found'); return false; }
  if (sec.password === password) {
    sec.unlocks = (sec.unlocks || 0) + 1;
    saveState();
    showSecretView(sec);
    return true;
  } else {
    toast('❌ Wrong password');
    return false;
  }
}

function deleteSecret(id) {
  if (!confirm('Delete permanently?')) return;
  APP.secrets = APP.secrets.filter(s => s.id !== id);
  APP.favorites.delete(id);
  saveState();
  renderVault();
  renderDiscovery();
  toast('🗑️ Deleted');
}

function toggleFavorite(id) {
  if (APP.favorites.has(id)) APP.favorites.delete(id);
  else APP.favorites.add(id);
  saveState();
  renderVault();

}

function handleUnlock(id) {
  const pass = document.getElementById('unlockPass').value;

  }
}

  if (!list.length) { container.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  let html = '';
  list.forEach(s => {
    const isFav = APP.favorites.has(s.id);
    const tierClass = s.tier === 'premium' ? 'premium' : (s.tier === 'vip' ? 'vip' : (s.tier === 'luxury' ? 'luxury' : (s.tier === 'ultimate' ? 'ultimate' : '')));
    const badge = s.tier === 'premium' ? '💕 PREMIUM' : (s.tier === 'vip' ? '👑 VIP' : (s.tier === 'luxury' ? '✨ LUXURY' : (s.tier === 'ultimate' ? '🌟 ULTIMATE' : '🔒')));

// ============================================================
function renderDiscovery() {
  const container = document.getElementById('discoveryGrid');
  const countEl = document.getElementById('vaultCountDiscovery');
  
  // Get only real user vaults that are public
  const publicVaults = APP.secrets.filter(sec => sec.isPublic && !sec.isDemo);
  
  if (!publicVaults.length) {
    container.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#9a8a92; padding:30px 0;">
      <i class="fas fa-users" style="font-size:2rem; display:block; margin-bottom:8px;"></i>
      <p>No public vaults yet.<br>Be the first to share!</p>
      <button class="btn btn-primary btn-sm mt-2" onclick="navigateTo('create')">Create Vault</button>
    </div>`;
    countEl.textContent = '0 vaults';
    return;
  }
  
  countEl.textContent = publicVaults.length + ' vaults';
  
  let html = '';
  publicVaults.forEach(vault => {
    const isLocked = true;
    const tier = vault.tier || 'standard';
    const tierDisplay = tier === 'standard' ? 'Standard' : tier.toUpperCase();
    const tierColor = tier === 'premium' ? '#ffd700' : (tier === 'vip' ? '#9b59b6' : (tier === 'luxury' ? '#c9a84c' : (tier === 'ultimate' ? '#e0c8ff' : '#888')));
    
    const hasAccess = APP.membership === tier || APP.membership === 'ultimate' || 
                      (tier === 'premium' && ['premium','vip','luxury','ultimate'].includes(APP.membership)) ||
                      (tier === 'vip' && ['vip','luxury','ultimate'].includes(APP.membership)) ||
                      (tier === 'luxury' && ['luxury','ultimate'].includes(APP.membership));
    
    const isOwned = APP.secrets.some(s => s.id === vault.id);
    
    let buttonHtml = '';
    if (isOwned) {
      buttonHtml = `<button class="btn btn-sm btn-primary" onclick="openUnlockModal('${vault.id}')">🔓 Open Vault</button>`;
    } else if (hasAccess) {
      buttonHtml = `<button class="btn btn-sm btn-primary" onclick="openUnlockModal('${vault.id}')">🔓 Unlock Vault</button>`;
    } else {
      buttonHtml = `<button class="btn btn-sm" style="background:#f0e8ec;" onclick="showUpgradePrompt('${tier}')">🔒 ${tierDisplay} Required</button>`;
    }
    
    html += `
      <div class="vault-discovery-card">
        <div class="vault-icon">${vault.category ? vault.category.charAt(0) : '🔐'}</div>
        <div class="vault-name">${vault.name}</div>
        <div class="vault-desc">${vault.description || 'No description'}</div>

          <span class="vault-status ${isLocked ? 'locked' : 'unlocked'}">
            ${isLocked ? '🔒 Locked' : '🔓 Unlocked'}
          </span>
          <span style="color:${tierColor}; font-weight:600;">${tierDisplay}</span>
        </div>
        ${buttonHtml}

  container.innerHTML = html;
}

function shareSecret(id) {
  const sec = APP.secrets.find(s => s.id === id);
  if (!sec) return;
  const link = window.location.href + '?secret=' + sec.id;
  const msg = `I left something private for you 🔐\nSecret: ${sec.name}\nOpen: ${link}`;
  if (navigator.share) navigator.share({ title: sec.name, text: msg, url: link }).catch(()=>{});
  else window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
  navigator.clipboard?.writeText(link).catch(()=>{});
  toast('📤 Share link copied');
}

function copySecret(text) {
  navigator.clipboard?.writeText(text).then(()=>toast('✓ Copied')).catch(()=>toast('Copy manually'));
}

// ============================================================
// SHOP - Enhanced Rendering
// ============================================================
function renderShop(filter = 'all') {
  const container = document.getElementById('shopGrid');
  let items = SHOP_ITEMS;
  if (filter !== 'all') items = items.filter(i => i.category === filter);
  if (!items.length) {
    container.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#9a8a92; padding:30px 0;">
      <i class="fas fa-box-open" style="font-size:2rem; display:block; margin-bottom:8px;"></i>
      <p>No items in this category</p>
    </div>`;
    return;
  }
  
  let html = '';
  items.forEach(item => {
    const owned = APP.owned.has(item.id);
    const locked = item.tier && APP.membership !== item.tier && !APP.owned.has(item.id);
    const canAfford = APP.tokens >= item.price;
    const rarityClass = 'rarity-' + (item.rarity || 'common');
    const tierLabel = item.tier ? `<span class="tier-required">${item.tier.toUpperCase()}</span>` : '';
    
    html += `<div class="shop-item">
      ${owned ? '<span class="owned-badge">✓ OWNED</span>' : ''}
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-price">🪙 ${item.price}</div>
      <span class="rarity ${rarityClass}">${item.rarity?.toUpperCase() || 'COMMON'}</span>
      ${tierLabel}
      <button class="btn btn-sm ${owned ? 'btn-outline' : 'btn-primary'}" onclick="buyShopItem('${item.id}')" ${locked ? 'disabled style="opacity:0.5;"' : ''}>
        ${owned ? '✓ Owned' : (locked ? '🔒 Locked' : (canAfford ? 'Buy Now' : '🪙 Insufficient'))}
      </button>
    </div>`;
  });
  container.innerHTML = html;
  
  // Update filter buttons
  document.querySelectorAll('.shop-filters .btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.shopFilter === filter);
  });
}

function buyShopItem(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  if (APP.owned.has(itemId)) { toast('Already owned'); return; }
  if (item.tier && APP.membership !== item.tier) { toast('🔒 ' + item.tier.toUpperCase() + ' membership required'); return; }
  if (APP.tokens < item.price) { toast('Need ' + (item.price - APP.tokens) + ' more tokens'); return; }
  if (!confirm(`Purchase ${item.name} for ${item.price} tokens?`)) return;
  APP.tokens -= item.price;
  APP.owned.add(itemId);
  APP.transactions.push({ type: 'shop', item: item.name, amount: -item.price, date: new Date().toISOString() });
  saveState();
  updateUI();
  renderShop(APP.shopFilter);
  toast('✅ ' + item.name + ' purchased!');
}

function filterShop(category) {
  APP.shopFilter = category;
  renderShop(category);
}

// ============================================================
// NAVIGATION
// ============================================================
function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.bottom-nav button').forEach(b => {
    if (b.dataset.page === page) b.classList.add('active');
  });
  if (page === 'vault') renderVault();
  if (page === 'favorites') renderFavorites();
  if (page === 'shop') renderShop(APP.shopFilter);
  if (page === 'premium') { renderPlans(); renderTokenPackages(); }
  if (page === 'settings') loadSettings();
  if (page === 'landing') renderDiscovery();
  document.getElementById('modalOverlay').classList.remove('show');
}

document.querySelectorAll('.bottom-nav button').forEach(btn => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.page));
});

// SETTINGS
// ============================================================
function loadSettings() {
  document.getElementById('profileName').value = APP.settings.profileName || '';
  document.getElementById('profileEmail').value = APP.settings.profileEmail || '';
  document.getElementById('themeSelect').value = APP.settings.theme || 'light';
}
function saveSettings() {
  APP.settings.profileName = document.getElementById('profileName').value;
  APP.settings.profileEmail = document.getElementById('profileEmail').value;
  APP.settings.theme = document.getElementById('themeSelect').value;
  saveState();
  toast('✓ Settings saved');
  applyTheme();
}

function applyTheme() {
  const theme = APP.settings.theme || 'light';
  if (theme === 'dark') {
    document.body.classList.add('dark');
  } else {
    document.body.classList.remove('dark');
  }
}

// ============================================================
// UTILITIES
// ============================================================
function toast(msg) {
  const container = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = msg;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2800);
}

function copyText(text) {
  navigator.clipboard?.writeText(text).then(() => toast('✓ Copied')).catch(() => toast('Copy manually'));
}

// ============================================================
// INIT
// ============================================================
function init() {
  loadState();
  applyTheme();
  updateUI();
  renderVault();
  renderFavorites();
  renderPlans();
  renderTokenPackages();
  renderShop('all');
  renderDiscovery();

  const icon = document.getElementById('vaultGlow');
  if (icon) setInterval(() => icon.classList.toggle('glow'), 1800);

  const params = new URLSearchParams(window.location.search);
  const secretId = params.get('secret');
  if (secretId) {
    const sec = APP.secrets.find(s => s.id === secretId);
    if (sec) setTimeout(() => openUnlockModal(sec.id), 600);
  }

  navigateTo('landing');
  toast('💕 Secretora · Private Vault');
}

});

style.textContent = `.glow { filter: drop-shadow(0 0 40px rgba(255,20,100,0.3)); }`;
